<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Records | General Hospital Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pgh-black: #020202;
            --pgh-dark-green: #0D2818;
            --pgh-emerald: #04471C;
            --white: #ffffff;
            --light-gray: #f4f7f6;
            --border-color: #e0e0e0;
            --urgent-red: #e74c3c;
        }

        * { box-sizing: border-box; transition: 0.3s ease; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light-gray); color: var(--pgh-black); overflow-x: hidden; }

        header { 
            background: linear-gradient(rgba(13, 40, 24, 0.85), rgba(13, 40, 24, 0.85)), url('bg1.png');
            background-size: cover;
            background-position: center;
            padding: 15px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border-bottom: 4px solid var(--pgh-emerald); 
        }
        
        .hospital-logo { width: 40px; height: 40px; object-fit: contain; }
        .brand-text h2 { margin: 0; font-size: 1rem; color: var(--white); text-transform: uppercase; line-height: 1.1; }
        .brand-text small { color: rgba(255, 255, 255, 0.8); font-size: 0.65rem; display: block; }

        nav { background: var(--pgh-dark-green); position: sticky; top: 0; z-index: 1000; overflow-x: auto; white-space: nowrap; }
        nav ul { list-style: none; margin: 0; padding: 10px 15px; display: flex; gap: 8px; }
        nav ul li a { color: white; text-decoration: none; padding: 6px 15px; display: inline-block; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; border-radius: 50px; background: rgba(255,255,255,0.1); }
        .active-nav { background: var(--pgh-emerald) !important; border: 1px solid rgba(255,255,255,0.2); }

        .container { padding: 20px 15px; max-width: 1400px; margin: 0 auto; min-height: 80vh; }
        
        .page-header { margin-bottom: 20px; }
        h1 { 
            color: var(--pgh-dark-green); 
            text-transform: uppercase; 
            font-size: 1.4rem; 
            margin: 0; 
            border-bottom: 3px solid var(--pgh-emerald);
            padding-bottom: 8px;
            display: inline-block;
        }

        .search-container { margin-top: 15px; }
        .search-bar { display: flex; background: white; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .search-bar input { border: none; outline: none; width: 100%; margin-left: 10px; font-size: 0.9rem; }

        .tabs { display: flex; gap: 10px; margin: 20px 0; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 8px 15px; cursor: pointer; font-weight: 600; color: #888; font-size: 0.8rem; border-radius: 5px; background: #eee; white-space: nowrap; }
        .tab.active { color: white; background: var(--pgh-emerald); }

        .table-responsive { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #f9f9f9; text-align: left; padding: 12px; font-size: 0.7rem; text-transform: uppercase; color: #666; border-bottom: 2px solid #eee; }
        td { padding: 15px 12px; border-bottom: 1px solid #eee; font-size: 0.85rem; vertical-align: middle; }
        
        .patient-info { display: flex; align-items: center; gap: 10px; }
        .patient-avatar { width: 32px; height: 32px; background: var(--light-gray); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--pgh-emerald); font-size: 0.8rem; }

        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }
        .status-discharged { background: #e8f5e9; color: #2e7d32; }
        .status-active { background: #e3f2fd; color: #1565c0; }

        .action-btn { background: none; border: 1.5px solid var(--pgh-emerald); color: var(--pgh-emerald); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
        .btn-delete { border-color: var(--urgent-red); color: var(--urgent-red); margin-left: 5px; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 450px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--pgh-emerald); padding-bottom: 10px; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; font-size: 1.2rem; color: var(--pgh-dark-green); }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #eee; font-size: 0.85rem; }
        .detail-label { font-weight: bold; color: #666; }

        footer { text-align: center; padding: 30px 15px; color: #999; font-size: 0.7rem; border-top: 1px solid #ddd; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="Hospital Logo" class="hospital-logo">
    <div class="brand-text">
        <h2>General Hospital</h2>
        <small>Electronic Medical Records (EMR)</small>
    </div>
</header>

<nav>
    <ul>
        <li><a href="admin_dashboard.html">ER Dashboard</a></li>
        <li><a href="patient_records.html" class="active-nav">Patient Records</a></li>
        <li><a href="admin_analytics.html">ER Analytics</a></li>
    </ul>
</nav>

<div class="container">
    <div class="page-header">
        <h1>Archival</h1>
        <div class="search-container">
            <div class="search-bar">
                <i class="fas fa-search" style="color:#aaa"></i>
                <input type="text" id="searchInput" onkeyup="searchRecords()" placeholder="Search patients...">
            </div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('ALL', this)">All Records</div>
        <div class="tab" onclick="switchTab('ACTIVE', this)">Active</div>
        <div class="tab" onclick="switchTab('DISCHARGED', this)">Discharged</div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Patient</th>
                    <th>Contact</th>
                    <th>Date/Time</th>
                    <th>Level / Dept</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="recordsTableBody"></tbody>
        </table>
    </div>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalName">Patient Name</h2>
            <i class="fas fa-times" onclick="closeModal()" style="cursor:pointer; color: #888;"></i>
        </div>
        <div id="modalBody"></div>
        <button class="action-btn" style="width:100%; margin-top:15px; background: var(--pgh-emerald); color: white;" onclick="closeModal()">Close</button>
    </div>
</div>

<footer>
    &copy; 2026 General Hospital Health Informatics.
</footer>

<script>
    function loadRecords(filter = 'ALL') {
        // Receives from home.html (hospitalAppointments) and admin_triage.html (patients)
        const portalData = JSON.parse(localStorage.getItem('hospitalAppointments')) || [];
        const triageData = JSON.parse(localStorage.getItem('patients')) || [];

        const allPatients = [
            ...portalData.map(p => ({ ...p, source: 'PORTAL' })),
            ...triageData.map(p => ({ ...p, source: 'TRIAGE' }))
        ];

        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '';

        allPatients.forEach((p, index) => {
            const isDischarged = p.status === 'DISCHARGED' || p.status === 'ARCHIVED' || p.isDischarged === true;
            if (filter === 'ACTIVE' && isDischarged) return;
            if (filter === 'DISCHARGED' && !isDischarged) return;

            const name = p.name || "Unknown";
            const contact = p.contact || p.phone || p.contactNo || "N/A";
            const time = p.timestamp || p.arrived || "N/A";
            
            // Logic to handle different data structures from the two sources
            const detail = p.source === 'PORTAL' ? (p.doctor || "General Dept") : (p.level || "Regular");
            const subtext = p.source === 'PORTAL' ? "Online Portal" : (p.age ? p.age + "Y | " + p.sex : "ER Triage");

            const row = `
                <tr>
                    <td>
                        <div class="patient-info">
                            <div class="patient-avatar">
                                <i class="fas ${p.source === 'PORTAL' ? 'fa-globe' : 'fa-user-nurse'}"></i>
                            </div>
                            <div>
                                <strong>${name}</strong><br>
                                <small style="color:#888">${subtext}</small>
                            </div>
                        </div>
                    </td>
                    <td>${contact}</td>
                    <td>${time}</td>
                    <td>
                        <span style="font-weight:bold; color: ${p.level === 'CRITICAL' ? 'var(--urgent-red)' : 'var(--pgh-emerald)'}">
                            ${detail}
                        </span>
                    </td>
                    <td>
                        <span class="status-pill ${isDischarged ? 'status-discharged' : 'status-active'}">
                            ${isDischarged ? 'Discharged' : 'Active'}
                        </span>
                    </td>
                    <td>
                        <div style="display:flex;">
                            <button class="action-btn" onclick="viewDetails('${p.source}', ${index})">View</button>
                            <button class="action-btn btn-delete" onclick="deleteRecord('${p.source}', ${index})"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `;
            tbody.insertAdjacentHTML('beforeend', row);
        });

        if (tbody.innerHTML === '') {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px; color:#888">No matching records found.</td></tr>';
        }
    }

    function viewDetails(source, index) {
        const key = source === 'PORTAL' ? 'hospitalAppointments' : 'patients';
        const data = JSON.parse(localStorage.getItem(key));
        const p = data[index];
        const body = document.getElementById('modalBody');
        document.getElementById('modalName').innerText = p.name;
        
        const contactVal = p.contact || p.phone || p.contactNo || 'N/A';

        if (source === 'PORTAL') {
            body.innerHTML = `
                <div class="detail-row"><span class="detail-label">Origin:</span> <span>Online Appointment</span></div>
                <div class="detail-row"><span class="detail-label">Contact:</span> <span>${contactVal}</span></div>
                <div class="detail-row"><span class="detail-label">Assigned Doctor:</span> <span>${p.doctor || 'TBD'}</span></div>
                <div class="detail-row"><span class="detail-label">Symptoms:</span> <span>${p.symptoms || 'Not listed'}</span></div>
            `;
        } else {
            body.innerHTML = `
                <div class="detail-row"><span class="detail-label">Origin:</span> <span>ER Triage Intake</span></div>
                <div class="detail-row"><span class="detail-label">Age / Sex:</span> <span>${p.age || 'N/A'} / ${p.sex || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">Triage Level:</span> <span style="font-weight:bold">${p.level || 'STABLE'}</span></div>
                <div class="detail-row"><span class="detail-label">Bed Assignment:</span> <span>${p.bed || 'Unassigned'}</span></div>
                <div class="detail-row"><span class="detail-label">Complaint:</span> <span>${p.complaint || 'N/A'}</span></div>
            `;
        }
        document.getElementById('detailsModal').style.display = 'flex';
    }

    function deleteRecord(source, index) {
        if(confirm("Are you sure you want to permanently delete this record?")) {
            const key = source === 'PORTAL' ? 'hospitalAppointments' : 'patients';
            let data = JSON.parse(localStorage.getItem(key));
            data.splice(index, 1);
            localStorage.setItem(key, JSON.stringify(data));
            loadRecords();
        }
    }

    function closeModal() { document.getElementById('detailsModal').style.display = 'none'; }

    function switchTab(type, element) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        element.classList.add('active');
        loadRecords(type);
    }

    function searchRecords() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let rows = document.getElementById('recordsTableBody').getElementsByTagName('tr');
        for (let row of rows) {
            row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
        }
    }

    window.onload = () => loadRecords();
</script>
</body>
</html>
