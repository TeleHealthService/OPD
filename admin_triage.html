<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Triage | General Hospital Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pgh-black: #020202;
            --pgh-dark-green: #0D2818;
            --pgh-emerald: #04471C;
            --white: #ffffff;
            --light-gray: #f4f7f6;
            --urgent-red: #e74c3c;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; transition: 0.3s ease; }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: var(--light-gray);
            color: var(--pgh-black);
        }

        /* --- Header & Nav --- */
        header {
            background-color: var(--white);
            padding: 10px 5%;
            display: flex;
            align-items: center;
            gap: 15px; 
            border-bottom: 4px solid var(--pgh-emerald);
        }
        .logo-placeholder { width: 50px; height: 50px; background: #eee; border-radius: 50%; }
        .brand-text h2 { margin: 0; font-size: 1.2rem; color: var(--pgh-dark-green); text-transform: uppercase; }

        nav { background: var(--pgh-dark-green); padding: 12px 0; position: sticky; top: 0; z-index: 1000; }
        nav ul { list-style: none; margin: 0; padding: 0 5%; display: flex; gap: 12px; }
        nav ul li a { color: white; text-decoration: none; padding: 8px 22px; display: block; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; border-radius: 50px; }
        .active-nav { background: var(--pgh-emerald); }

        /* --- Triage Layout --- */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        .action-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-small { padding: 8px 15px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; border: none; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .btn-back { background: #ddd; color: #333; }
        .btn-code { background: var(--urgent-red); color: white; }

        .triage-card { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            border-top: 8px solid var(--pgh-emerald); 
        }
        
        .triage-header h1 { color: var(--pgh-dark-green); text-transform: uppercase; margin: 0; font-size: 1.6rem; }
        .triage-header p { color: #666; font-size: 0.9rem; margin: 5px 0 30px; }

        h3 { font-size: 1rem; color: var(--pgh-emerald); border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-top: 30px; text-transform: uppercase; }

        label { display: block; margin: 20px 0 8px; font-weight: 600; color: var(--pgh-dark-green); font-size: 0.85rem; }
        select, input, textarea { width: 100%; padding: 12px 15px; border: 1.5px solid #eee; border-radius: 8px; font-size: 1rem; background: #fafafa; outline: none; }
        select:focus, input:focus, textarea:focus { border-color: var(--pgh-emerald); background: white; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .btn-submit { 
            width: 100%; 
            background: var(--pgh-emerald); 
            color: white; 
            border: none; 
            padding: 18px; 
            border-radius: 8px; 
            font-weight: 800; 
            font-size: 1rem; 
            margin-top: 40px; 
            cursor: pointer; 
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(4, 71, 28, 0.2);
        }
        .btn-submit:hover { background: var(--pgh-dark-green); transform: translateY(-2px); }
    </style>
</head>
<body>

<header><img src="logo.png" alt="General Hospital Logo" style="width: 50px; height: 50px; object-fit: contain;">
    <div class="brand-text">
        <h2>General Hospital</h2>
        <small>Admissions & Triage Department</small>
    </div>
</header>

<nav>
    <ul>
        <li><a href="admin_dashboard.html">ER Dashboard</a></li>
        <li><a href="patient_record.html">Patient Records</a></li>
        <li><a href="admin_triage.html" class="active-nav">Waitlist Triage</a></li>
        <li><a href="admin_analytics.html">ER Analytics</a></li>
    </ul>
</nav>

<div class="container">
    <div class="action-bar">
        <a href="admin_dashboard.html" class="btn-small btn-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <button class="btn-small btn-code" onclick="alert('Code Blue Initiated!')"><i class="fas fa-bolt"></i> Emergency Code</button>
    </div>

    <div class="triage-card">
        <div class="triage-header">
            <h1>Patient Triage</h1>
            <p>Registration for incoming Walk-in or Emergency cases.</p>
        </div>

        <form id="triageForm">
            <h3>1. Personal Information</h3>
            <label>Full Name *</label>
            <input type="text" id="name" placeholder="Surname, First Name Middle Name" required>

            <div class="grid-2">
                <div>
                    <label>Age *</label>
                    <input type="number" id="age" placeholder="Ex. 25" required>
                </div>
                <div>
                    <label>Gender *</label>
                    <select id="sex" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <label>Contact Number</label>
            <input type="tel" id="contact" placeholder="09XX-XXX-XXXX">

            <h3>2. Clinical Assessment</h3>
            <label>Initial Severity Level (Triage)</label>
            <select id="level" required>
                <option value="STABLE">STABLE (Standard)</option>
                <option value="URGENT">URGENT (Intermediate)</option>
                <option value="CRITICAL">CRITICAL (Immediate)</option>
            </select>

            <label>Chief Complaint *</label>
            <textarea id="complaint" rows="4" placeholder="Briefly describe the symptoms or reason for admission..." required></textarea>

            <button type="submit" class="btn-submit">Register Patient to ER Queue</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('triageForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. Collect Data
        const newPatient = {
            name: document.getElementById('name').value,
            age: document.getElementById('age').value,
            sex: document.getElementById('sex').value,
            contact: document.getElementById('contact').value,
            level: document.getElementById('level').value,
            complaint: document.getElementById('complaint').value,
            arrived: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            status: 'WAITING',
            isDischarged: false
        };

        // 2. Save to LocalStorage
        let patients = JSON.parse(localStorage.getItem('patients')) || [];
        patients.push(newPatient);
        localStorage.setItem('patients', JSON.stringify(patients));

        // 3. Success Feedback & Redirect
        alert("Patient " + newPatient.name + " has been added to the queue.");
        window.location.href = "admin_dashboard.html";
    });
</script>

</body>
</html>
