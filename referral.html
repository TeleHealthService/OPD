<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patient Referral | General Hospital Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --pgh-black: #020202;
            --pgh-dark-green: #0D2818;
            --pgh-emerald: #04471C;
            --white: #ffffff;
            --light-gray: #f4f7f6;
            --border-color: #e0e0e0;
            --urgent-red: #e74c3c;
        }

        * { box-sizing: border-box; transition: 0.3s ease; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light-gray); color: var(--pgh-black); overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }

        header { 
            background: linear-gradient(rgba(13, 40, 24, 0.85), rgba(13, 40, 24, 0.85)), url('bg1.png');
            background-size: cover; background-position: center; padding: 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 4px solid var(--pgh-emerald); 
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .hospital-logo { width: 40px; height: 40px; object-fit: contain; }
        .brand-text h2 { margin: 0; font-size: 1rem; color: var(--white); text-transform: uppercase; line-height: 1.1; }
        .brand-text small { color: rgba(255, 255, 255, 0.8); font-size: 0.65rem; display: block; }

        nav { background: var(--pgh-dark-green); position: sticky; top: 0; z-index: 1000; }
        nav ul { list-style: none; margin: 0; padding: 10px 15px; display: flex; gap: 8px; overflow-x: auto; }
        nav ul li a { color: white; text-decoration: none; padding: 8px 18px; display: inline-block; font-size: 0.7rem; text-transform: uppercase; font-weight: 700; border-radius: 50px; background: rgba(255,255,255,0.1); border: 1px solid transparent; white-space: nowrap; }
        nav ul li a:hover { background: rgba(255,255,255,0.2); }
        .active-nav { background: var(--pgh-emerald) !important; border: 1px solid rgba(255,255,255,0.3) !important; }

        .container { padding: 25px 15px; max-width: 800px; margin: 0 auto; flex: 1; width: 100%; }
        h1 { color: var(--pgh-dark-green); text-transform: uppercase; font-size: 1.4rem; margin: 0 0 20px 0; padding-bottom: 8px; display: inline-block; border-bottom: 3px solid var(--pgh-emerald); }

        .referral-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-top: 8px solid var(--pgh-emerald); }
        .referral-card h3 { margin-top: 0; font-size: 0.9rem; text-transform: uppercase; color: var(--pgh-dark-green); display: flex; align-items: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #999; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        input, select, textarea { width: 100%; padding: 14px; border: 1.5px solid #eee; border-radius: 12px; font-size: 0.9rem; font-weight: 500; outline: none; background: #fcfcfc; color: var(--pgh-black); }
        input:focus, select:focus, textarea:focus { border-color: var(--pgh-emerald); background: #fff; box-shadow: 0 0 0 4px rgba(4, 71, 28, 0.05); }

        .btn-submit { width: 100%; padding: 18px; background: var(--pgh-emerald); color: white; border: none; border-radius: 50px; font-size: 0.85rem; font-weight: 800; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(4, 71, 28, 0.2); letter-spacing: 1px; }
        .btn-submit:hover { background: var(--pgh-dark-green); transform: translateY(-2px); }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; transform: none; }

        .success-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--pgh-dark-green); color: white; padding: 15px 35px; border-radius: 50px; display: none; z-index: 2000; font-size: 0.8rem; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-transform: uppercase; }
        footer { background: var(--pgh-dark-green); color: rgba(255,255,255,0.6); text-align: center; padding: 25px; font-size: 0.7rem; border-top: 4px solid var(--pgh-emerald); margin-top: auto; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png" alt="Logo" class="hospital-logo">
        <div class="brand-text">
            <h2>General Hospital</h2>
            <small>Health Informatics Division</small>
        </div>
    </div>
</header>

<nav>
    <ul>
        <li><a href="admin_dashboard.html">ER Dashboard</a></li>
        <li><a href="patient_record.html">Registry Records</a></li>
        <li><a href="referral.html" class="active-nav">Referral</a></li>
        <li><a href="admin_analytics.html">ER Analytics</a></li>
    </ul>
</nav>

<div class="container">
    <h1>Patient Referral</h1>

    <div class="referral-card">
        <form id="referralForm">
            <h3><i class="fas fa-file-export"></i> Referral Details</h3>
            
            <div class="form-group">
                <label>Active Patient Selection</label>
                <select id="patientSelect" required onchange="updatePatientDetails()">
                    <option value="">-- SELECT PATIENT --</option>
                </select>
                <input type="hidden" id="patientEmail">
                <input type="hidden" id="patientNameDisplay">
            </div>

            <div class="form-group">
                <label>Recipient Specialization / Department</label>
                <select id="targetDept" required>
                    <option value="">-- Choose Target Specialty --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Triage Priority</label>
                <select id="priority" required>
                    <option value="Routine">Routine (Stable)</option>
                    <option value="Urgent">Urgent (Semi-Stable)</option>
                    <option value="Emergency">Emergency (Immediate Care)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Clinical Notes & Transfer Reason</label>
                <textarea id="notes" rows="5" required placeholder="Describe current status, vitals, and reasons for referral..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> &nbsp;Dispatch Digital Referral
            </button>
        </form>
    </div>
</div>

<div id="successToast" class="success-toast">Referral Dispatched via Secure Mail!</div>

<footer>
    &copy; 2026 General Hospital | Secure Referral Portal | informatics-pgh.edu
</footer>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://general-hospital-74691-default-rtdb.firebaseio.com/",
        projectId: "general-hospital-74691"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    emailjs.init("6vxfanTnFPba4cmq7"); 

    window.onload = function() {
        loadPatientsFromCloud();
        loadDepartmentsFromTeam();
    };

    function loadPatientsFromCloud() {
        const patientSelect = document.getElementById('patientSelect');
        const paths = ['appointments', 'patients'];
        
        const updateList = () => {
            patientSelect.innerHTML = '<option value="">-- SELECT PATIENT --</option>';
            
            paths.forEach(path => {
                db.ref(path).once('value', (snapshot) => {
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        // Only add if not discharged and has a name
                        if (data.name && data.status !== "DISCHARGED" && data.status !== "Discharged") {
                            const opt = document.createElement('option');
                            opt.value = childSnapshot.key;
                            opt.textContent = data.name.toUpperCase(); // JUST THE NAME
                            opt.dataset.email = data.email || "no-email@hospital.com";
                            opt.dataset.name = data.name;
                            patientSelect.appendChild(opt);
                        }
                    });
                });
            });
        };

        // Initial load and listen for changes
        updateList();
        db.ref('appointments').on('value', updateList);
        db.ref('patients').on('value', updateList);
    }

    function loadDepartmentsFromTeam() {
        const deptSelect = document.getElementById('targetDept');
        const doctors = JSON.parse(localStorage.getItem('hospitalDoctors')) || [];
        const uniqueSpecs = [...new Set(doctors.map(d => d.spec))];
        
        uniqueSpecs.forEach(spec => {
            if(spec) deptSelect.add(new Option(spec, spec));
        });
        deptSelect.add(new Option("External Facility / Tertiary Care", "External"));
    }

    function updatePatientDetails() {
        const select = document.getElementById('patientSelect');
        const selectedOption = select.options[select.selectedIndex];
        if (selectedOption && selectedOption.value !== "") {
            document.getElementById('patientEmail').value = selectedOption.dataset.email;
            document.getElementById('patientNameDisplay').value = selectedOption.dataset.name;
        }
    }

    document.getElementById('referralForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> Processing...';
        btn.disabled = true;

        const referralData = {
            to_name: document.getElementById('patientNameDisplay').value,
            to_email: document.getElementById('patientEmail').value,
            department: document.getElementById('targetDept').value,
            priority: document.getElementById('priority').value,
            message: document.getElementById('notes').value,
            referral_date: new Date().toLocaleString()
        };

        emailjs.send("service_z8p5csl", "template_rox5fkc", referralData)
            .then(() => {
                document.getElementById('successToast').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('successToast').style.display = 'none';
                    document.getElementById('referralForm').reset();
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> &nbsp;Dispatch Digital Referral';
                    btn.disabled = false;
                }, 3000);
            })
            .catch((err) => {
                alert("Cloud Dispatch Failed: " + JSON.stringify(err));
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> &nbsp;Dispatch Digital Referral';
            });
    };
</script>
</body>
</html>
