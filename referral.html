<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patient Referral | General Hospital Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --pgh-black: #020202;
            --pgh-dark-green: #0D2818;
            --pgh-emerald: #04471C;
            --white: #ffffff;
            --light-gray: #f4f7f6;
        }

        * { box-sizing: border-box; transition: 0.3s ease; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light-gray); color: var(--pgh-black); overflow-x: hidden; }

        header { 
            background: linear-gradient(rgba(13, 40, 24, 0.85), rgba(13, 40, 24, 0.85)), url('bg1.png');
            background-size: cover;
            padding: 15px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border-bottom: 4px solid var(--pgh-emerald); 
        }
        
        .hospital-logo { width: 40px; height: 40px; object-fit: contain; }
        .brand-text h2 { margin: 0; font-size: 1rem; color: var(--white); text-transform: uppercase; line-height: 1.1; }
        .brand-text small { color: rgba(255, 255, 255, 0.8); font-size: 0.65rem; display: block; }

        nav { background: var(--pgh-dark-green); position: sticky; top: 0; z-index: 1000; overflow-x: auto; white-space: nowrap; }
        nav ul { list-style: none; margin: 0; padding: 10px 15px; display: flex; gap: 8px; }
        nav ul li a { color: white; text-decoration: none; padding: 6px 15px; display: inline-block; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; border-radius: 50px; background: rgba(255,255,255,0.1); }
        .active-nav { background: var(--pgh-emerald) !important; }

        .container { padding: 20px 15px; max-width: 800px; margin: 0 auto; }
        .referral-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 6px solid var(--pgh-emerald);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #eee;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background: #fafafa;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--pgh-emerald);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

        .success-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--pgh-dark-green);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="Logo" class="hospital-logo">
    <div class="brand-text">
        <h2>General Hospital</h2>
        <small>Health Informatics Division</small>
    </div>
</header>

<nav>
    <ul>
        <li><a href="admin_dashboard.html">ER Dashboard</a></li>
        <li><a href="patient_record.html">Records</a></li>
        <li><a href="referral.html" class="active-nav">Referral</a></li>
        <li><a href="admin_analytics.html">Analytics</a></li>
    </ul>
</nav>

<div class="container">
    <h1>Patient Referral</h1>

    <div class="referral-card">
        <form id="referralForm">
            <h3><i class="fas fa-user-injured"></i> Patient Information</h3>
            <div class="form-group">
                <label>Select Active Patient (From Cloud)</label>
                <select id="patientSelect" required onchange="updatePatientDetails()">
                    <option value="">-- Loading Patients... --</option>
                </select>
                <input type="hidden" id="patientEmail">
                <input type="hidden" id="patientNameDisplay">
            </div>

            <div class="form-group">
                <label>Referring To (Department)</label>
                <select id="targetDept" required>
                    <option value="">-- Select Specialty --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Priority Level</label>
                <select id="priority" required>
                    <option value="Routine">Routine</option>
                    <option value="Urgent">Urgent</option>
                    <option value="Emergency">Emergency</option>
                </select>
            </div>

            <div class="form-group">
                <label>Clinical Notes</label>
                <textarea id="notes" rows="4" required placeholder="Reason for transfer..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Generate & Email Referral</button>
        </form>
    </div>
</div>

<div id="successToast" class="success-toast">Referral Sent Successfully!</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    // 1. Firebase Initialization
    const firebaseConfig = {
        databaseURL: "https://general-hospital-74691-default-rtdb.firebaseio.com/",
        projectId: "general-hospital-74691"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. EmailJS Initialization
    emailjs.init("6vxfanTnFPba4cmq7"); 

    // 3. Load Data
    window.onload = function() {
        loadPatientsFromCloud();
        loadDepartmentsFromTeam();
    };

    function loadPatientsFromCloud() {
        const patientSelect = document.getElementById('patientSelect');
        // Listens to the 'appointments' node
        db.ref('appointments').on('value', (snapshot) => {
            patientSelect.innerHTML = '<option value="">-- Choose Patient --</option>';
            snapshot.forEach((childSnapshot) => {
                const data = childSnapshot.val();
                // Broadened filter to include "Pending" or "Active"
                if (data.status === "Active" || data.status === "Pending" || !data.status) {
                    const opt = document.createElement('option');
                    opt.value = childSnapshot.key;
                    opt.textContent = `${data.name} (ID: ${childSnapshot.key.substring(1, 6)})`;
                    opt.dataset.email = data.email;
                    opt.dataset.name = data.name;
                    patientSelect.appendChild(opt);
                }
            });
        });
    }

    function loadDepartmentsFromTeam() {
        const deptSelect = document.getElementById('targetDept');
        const doctors = JSON.parse(localStorage.getItem('hospitalDoctors')) || [];
        const uniqueSpecs = [...new Set(doctors.map(d => d.spec))];
        
        uniqueSpecs.forEach(spec => {
            deptSelect.add(new Option(spec, spec));
        });
        deptSelect.add(new Option("External Facility", "External"));
    }

    function updatePatientDetails() {
        const select = document.getElementById('patientSelect');
        const selectedOption = select.options[select.selectedIndex];
        document.getElementById('patientEmail').value = selectedOption.dataset.email || "";
        document.getElementById('patientNameDisplay').value = selectedOption.dataset.name || "";
    }

    // 4. Form Submission
    document.getElementById('referralForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Sending...";
        btn.disabled = true;

        const referralData = {
            to_name: document.getElementById('patientNameDisplay').value,
            to_email: document.getElementById('patientEmail').value,
            department: document.getElementById('targetDept').value,
            priority: document.getElementById('priority').value,
            message: document.getElementById('notes').value,
            referral_date: new Date().toLocaleDateString()
        };

        emailjs.send("service_z8p5csl", "template_rox5fkc", referralData)
            .then(() => {
                document.getElementById('successToast').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('successToast').style.display = 'none';
                    document.getElementById('referralForm').reset();
                    btn.innerText = "Generate & Email Referral";
                    btn.disabled = false;
                }, 3000);
            })
            .catch((err) => {
                alert("Error: " + JSON.stringify(err));
                btn.disabled = false;
            });
    };
</script>
</body>
</html>
