<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal | General Hospital OPD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pgh-black: #020202;
            --pgh-dark-green: #006400;
            --pgh-emerald: #4CAF50;
            --white: #ffffff;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--white);
            overflow-x: hidden;
        }

        .portal-wrapper {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .hero-side {
            background: linear-gradient(rgba(13, 40, 24, 0.7), rgba(2, 2, 2, 0.8)), 
                        url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .login-side {
            background: var(--white);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            background: var(--white);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-top: 5px solid var(--pgh-emerald);
        }

        .brand-container { text-align: center; margin-bottom: 30px; }

        .logo-placeholder {
            width: 100px; height: 100px; margin: 0 auto 15px;
            background: #f0f0f0; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--pgh-emerald); overflow: hidden;
        }

        .actual-logo { width: 100%; height: 100%; object-fit: cover; }

        h1 { color: var(--pgh-dark-green); font-size: 1.5rem; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: #666; font-size: 0.85rem; margin-top: 5px; }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 40px; color: var(--pgh-emerald); }

        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--pgh-dark-green); }
        
        input {
            width: 100%; padding: 12px 12px 12px 40px;
            border: 1px solid #ddd; border-radius: 8px;
            background: #fdfdfd; font-size: 1rem;
        }

        .btn-login, .btn-register {
            width: 100%; background: var(--pgh-emerald); color: white;
            padding: 15px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-top: 10px; box-shadow: 0 4px 15px rgba(4, 71, 28, 0.3);
        }

        .btn-login:hover, .btn-register:hover { background: var(--pgh-dark-green); transform: translateY(-2px); }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px); align-items: center; justify-content: center;
        }

        .modal-content {
            background-color: white; padding: 40px; border-radius: 15px;
            width: 90%; max-width: 450px; position: relative;
        }

        .close-modal { position: absolute; right: 20px; top: 20px; font-size: 1.5rem; cursor: pointer; color: #888; }

        @media (min-width: 992px) {
            .portal-wrapper { flex-direction: row; }
            .hero-side { flex: 1.2; padding: 60px; text-align: left; align-items: flex-start; }
            .login-side { flex: 0.8; }
        }

        footer { padding: 30px; text-align: center; font-size: 0.75rem; color: #888; background: #f9f9f9; }
    </style>
</head>
<body>

<div class="portal-wrapper">
    <div class="hero-side">
        <h2 style="font-size: 3rem; margin-bottom: 10px;">Service. Excellence.</h2>
        <p style="max-width: 500px; font-size: 1.1rem; line-height: 1.8; opacity: 0.9;">
            Welcome to the Integrated Outpatient Department Portal.
        </p>
    </div>

    <div class="login-side">
        <div class="login-card">
            <div class="brand-container">
                <div class="logo-placeholder"><img src="logo.png" alt="Logo" class="actual-logo"></div>
                <h1>General Hospital</h1>
                <p class="subtitle">Patient Management System</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <i class="fas fa-user"></i>
                    <input type="email" id="loginEmail" placeholder="Enter email" required>
                </div>
                <div class="input-group">
                    <label>Secure Password</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login" id="signInBtn">SIGN IN</button>
            </form>

            <div style="text-align: center; margin-top: 25px; font-size: 0.85rem; color: #666;">
                Don't have a Patient Account? <br>
                <a href="javascript:void(0)" id="openRegister" style="color: var(--pgh-emerald); font-weight: bold; text-decoration: none;">Register Now</a>
            </div>
        </div>
    </div>
</div>

<div id="registerModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 style="color: var(--pgh-dark-green); margin-bottom: 20px;">Create Account</h2>
        <form id="registerForm">
            <div class="input-group">
                <label>Full Name</label>
                <i class="fas fa-id-card"></i>
                <input type="text" id="regName" placeholder="Juan Dela Cruz" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <i class="fas fa-envelope"></i>
                <input type="email" id="regEmail" placeholder="email@example.com" required>
            </div>
            <div class="input-group">
                <label>Create Password</label>
                <i class="fas fa-lock"></i>
                <input type="password" id="regPass" placeholder="Min 6 chars" required minlength="6">
            </div>
            <button type="submit" class="btn-register" id="regBtn">REGISTER</button>
        </form>
    </div>
</div>

<footer>&copy; 2026 General Hospital Outpatient Department.</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBi-biOoGZ5SKa11R-qL1sPROv_s_ry6-0",
        authDomain: "general-hospital-74691.firebaseapp.com",
        databaseURL: "https://general-hospital-74691-default-rtdb.firebaseio.com",
        projectId: "general-hospital-74691",
        storageBucket: "general-hospital-74691.firebasestorage.app",
        messagingSenderId: "738110221541",
        appId: "1:738110221541:web:8eb8b5929efa27f741780c",
        measurementId: "G-XP2WQVDPJ1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const modal = document.getElementById("registerModal");
    const openBtn = document.getElementById("openRegister");
    const closeBtn = document.querySelector(".close-modal");

    openBtn.onclick = () => modal.style.display = "flex";
    closeBtn.onclick = () => modal.style.display = "none";
    window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        const btn = document.getElementById('regBtn');

        btn.innerText = "CREATING...";
        btn.disabled = true;

        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
            await db.ref('users/' + userCredential.user.uid).set({
                displayName: name,
                email: email,
                role: 'patient',
                createdAt: new Date().toLocaleString()
            });
            alert("Success! Welcome, " + name);
            window.location.href = "home.html";
        } catch (error) {
            alert(error.message);
            btn.innerText = "REGISTER";
            btn.disabled = false;
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        const btn = document.getElementById('signInBtn');

        btn.innerText = "SIGNING IN...";
        btn.disabled = true;

        try {
            await auth.signInWithEmailAndPassword(email, pass);
            window.location.href = "home.html";
        } catch (error) {
            alert(error.message);
            btn.innerText = "SIGN IN";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
