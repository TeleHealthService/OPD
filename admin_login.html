<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | General Hospital Administrative Gateway</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pgh-black: #020202;
            --pgh-dark-green: #0D2818;
            --pgh-emerald: #04471C;
            --white: #ffffff;
            --light-gray: #f4f7f5;
            --error-red: #e74c3c;
        }

        * { box-sizing: border-box; transition: 0.3s ease; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            /* Background matches the header style of your other pages for consistency */
            background: linear-gradient(rgba(13, 40, 24, 0.8), rgba(13, 40, 24, 0.8)), url('bg1.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Login Card - Mobile First */
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            border-top: 8px solid var(--pgh-emerald);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-placeholder {
            width: 70px;
            height: 70px;
            background: var(--light-gray);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--pgh-emerald);
        }

        .login-card h1 {
            color: var(--pgh-dark-green);
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 5px;
        }

        .login-card p {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 30px;
        }

        /* Form Styling */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--pgh-dark-green);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--pgh-emerald);
            font-size: 0.9rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1.5px solid #eee;
            border-radius: 10px;
            background: #fafafa;
            font-size: 1rem;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--pgh-emerald);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(4, 71, 28, 0.05);
        }

        /* Error Message */
        #errorMessage {
            color: var(--error-red);
            font-size: 0.75rem;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
        }

        /* Oblong Button Style */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--pgh-emerald);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 12px rgba(4, 71, 28, 0.2);
        }

        .btn-login:hover {
            background: var(--pgh-dark-green);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.65rem;
            color: #999;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-placeholder">
        <i class="fas fa-hospital-user fa-2x" style="color: var(--pgh-emerald);"></i>
    </div>
    <h1>Admin Gateway</h1>
    <p>Staff Secure Authentication</p>

    <div id="errorMessage">Invalid Username or Password</div>

    <form id="adminLoginForm">
        <div class="form-group">
            <label>Employee ID</label>
            <div class="input-wrapper">
                <i class="fas fa-user-md"></i>
                <input type="text" id="employeeId" placeholder="OPDAdmin" required>
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="footer-note">
        Authorized Access Only<br>
        &copy; 2026 General Hospital Health Informatics
    </div>
</div>

<script>
    document.getElementById('adminLoginForm').onsubmit = function(e) {
        e.preventDefault();
        
        const user = document.getElementById('employeeId').value;
        const pass = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMessage');

        // Logic Check: Username and Password validation
        if (user === "OPDAdmin" && pass === "OPDadmin2026") {
            errorMsg.style.display = "none";
            // Success: Redirect to Dashboard
            window.location.href = 'admin_dashboard.html';
        } else {
            // Failure: Show error and shake card
            errorMsg.style.display = "block";
            const card = document.querySelector('.login-card');
            card.style.animation = 'none';
            setTimeout(() => {
                card.style.borderTopColor = "var(--error-red)";
                setTimeout(() => card.style.borderTopColor = "var(--pgh-emerald)", 500);
            }, 10);
        }
    };
</script>

</body>
</html>
