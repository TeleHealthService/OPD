<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | General Hospital Administrative Gateway</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pgh-black: #020202;
            --pgh-dark-green: #0D2818;
            --pgh-emerald: #04471C;
            --white: #ffffff;
            --light-gray: #f4f7f5;
        }

        * { box-sizing: border-box; transition: 0.3s ease; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Login Card - Glassmorphism style to match your portal */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 8px solid var(--pgh-emerald);
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: #eee;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card h1 {
            color: var(--pgh-dark-green);
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .login-card p {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 35px;
        }

        /* Form Styling */
        .form-group {
            text-align: left;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--pgh-dark-green);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--pgh-emerald);
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fdfdfd;
            font-size: 1rem;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--pgh-emerald);
            box-shadow: 0 0 0 4px rgba(4, 71, 28, 0.1);
        }

        /* Oblong Button Style (Matched) */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--pgh-emerald);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(4, 71, 28, 0.2);
        }

        .btn-login:hover {
            background: var(--pgh-dark-green);
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-placeholder">
        <i class="fas fa-hospital-user fa-2x" style="color: var(--pgh-emerald);"></i>
    </div>
    <h1>Admin Gateway</h1>
    <p>Staff Secure Authentication</p>

    <form id="adminLoginForm">
        <div class="form-group">
            <label>Employee ID</label>
            <div class="input-wrapper">
                <i class="fas fa-user-md"></i>
                <input type="text" id="employeeId" placeholder="Enter ID" required>
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="footer-note">
        &copy; 2026 General Hospital Health Informatics Division
    </div>
</div>

<script>
    document.getElementById('adminLoginForm').onsubmit = function(e) {
        e.preventDefault();
        
        // In a real scenario, you'd validate credentials here.
        // For your prototype, we redirect straight to the Dashboard.
        window.location.href = 'admin_dashboard.html';
    };
</script>

</body>
</html>
