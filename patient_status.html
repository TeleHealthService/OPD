<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Clinical Profile | General Hospital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pgh-dark-green: #0D2818;
            --pgh-emerald: #04471C;
            --light-gray: #f4f7f6;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light-gray); }
        header { 
            background: var(--pgh-dark-green); padding: 15px; color: white;
            display: flex; align-items: center; gap: 15px; border-bottom: 4px solid var(--pgh-emerald);
        }
        .back-btn { color: white; text-decoration: none; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-left: 15px; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .section-title { color: var(--pgh-emerald); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .info-item label { display: block; font-size: 0.7rem; color: #888; text-transform: uppercase; font-weight: bold; }
        .info-item span { font-size: 1rem; color: #333; font-weight: 600; }
        .vitals-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; text-align: center; }
        .vital-box { background: #f8fcf9; padding: 15px; border-radius: 8px; border: 1px solid #e0eee4; }
        .vital-box i { color: var(--pgh-emerald); margin-bottom: 5px; }
        .status-badge { padding: 5px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; background: var(--pgh-emerald); color: white; }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="Logo" style="width: 40px;">
    <div>
        <h2 style="margin:0; font-size: 1.1rem;">GENERAL HOSPITAL</h2>
        <small style="opacity:0.8;">Clinical Profile View</small>
    </div>
</header>

<div style="background: #111; padding: 10px;">
    <a href="admin_dashboard.html" class="back-btn"><i class="fas fa-chevron-left"></i> Back to Dashboard</a>
</div>

<div class="container" id="profileContent">
    <div style="text-align:center; padding: 50px; color: #888;">
        <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading patient records...
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://general-hospital-74691-default-rtdb.firebaseio.com/",
        projectId: "general-hospital-74691"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. Get ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const patientId = urlParams.get('id');

    if (!patientId) {
        document.getElementById('profileContent').innerHTML = "<h1>No Patient ID Provided</h1>";
    } else {
        fetchPatientData();
    }

    // 2. Logic to check both nodes
    function fetchPatientData() {
        const paths = ['patients', 'appointments'];
        let found = false;

        db.ref('patients/' + patientId).once('value', (snapshot) => {
            if (snapshot.exists()) {
                renderProfile(snapshot.val());
                found = true;
            } else {
                // If not in 'patients', try 'appointments'
                db.ref('appointments/' + patientId).once('value', (snap2) => {
                    if (snap2.exists()) {
                        renderProfile(snap2.val());
                        found = true;
                    } else {
                        document.getElementById('profileContent').innerHTML = "<h1>Patient Record Not Found</h1>";
                    }
                });
            }
        });
    }

    // 3. Render the data to HTML
    function renderProfile(p) {
        const container = document.getElementById('profileContent');
        
        // Handle vital signs from nurse.html (if they exist)
        const v = p.vitals || { bp: '--', temp: '--', hr: '--', o2: '--' };

        container.innerHTML = `
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:start;">
                    <div class="section-title">Personal Information</div>
                    <span class="status-badge">${p.status || 'ACTIVE'}</span>
                </div>
                <div class="grid">
                    <div class="info-item"><label>Full Name</label><span>${p.name || 'N/A'}</span></div>
                    <div class="info-item"><label>Patient ID</label><span>${patientId}</span></div>
                    <div class="info-item"><label>Age / Gender</label><span>${p.age || 'N/A'} / ${p.gender || p.sex || 'N/A'}</span></div>
                    <div class="info-item"><label>Contact</label><span>${p.contact || 'N/A'}</span></div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">Vital Signs (from Nurse Station)</div>
                <div class="vitals-grid">
                    <div class="vital-box"><i class="fas fa-heartbeat"></i><label>BP</label><span>${v.bp}</span></div>
                    <div class="vital-box"><i class="fas fa-thermometer-half"></i><label>TEMP</label><span>${v.temp}°C</span></div>
                    <div class="vital-box"><i class="fas fa-wind"></i><label>O2 Sat</label><span>${v.o2}%</span></div>
                    <div class="vital-box"><i class="fas fa-pulse"></i><label>HR</label><span>${v.hr} bpm</span></div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">Clinical Assessment</div>
                <div class="info-item" style="margin-bottom:15px;">
                    <label>Chief Complaint</label>
                    <p style="margin:5px 0; font-weight:600;">${p.symptoms || p.complaint || 'No complaint recorded.'}</p>
                </div>
                <div class="info-item">
                    <label>Nurse/Doctor Notes</label>
                    <p style="margin:5px 0; color:#555;">${p.clinical_notes || 'Pending evaluation from nurse station...'}</p>
                </div>
            </div>
        `;
    }
</script>
</body>
</html>
