<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile | General Hospital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pgh-dark-green: #0D2818;
            --pgh-emerald: #04471C;
            --white: #ffffff;
            --light-gray: #f4f7f6;
            --urgent-red: #e74c3c;
            --info-blue: #3498db;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; transition: 0.3s ease; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light-gray); color: #333; }

        /* --- Header & Nav (Dashboard Match) --- */
        header { 
            background: linear-gradient(rgba(13, 40, 24, 0.9), rgba(13, 40, 24, 0.9)), url('bg1.png');
            background-size: cover; padding: 15px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--pgh-emerald); 
        }
        .hospital-logo { width: 40px; height: 40px; }
        .brand-text h2 { margin: 0; font-size: 1rem; color: var(--white); text-transform: uppercase; }

        nav { background: var(--pgh-dark-green); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: white; text-decoration: none; font-size: 0.7rem; font-weight: bold; display: flex; align-items: center; gap: 5px; }

        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }

        /* --- Profile Header --- */
        .patient-header { background: white; border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .patient-identity h1 { margin: 0; font-size: 1.8rem; color: var(--pgh-dark-green); display: flex; align-items: center; gap: 10px; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: white; }
        .bg-crit { background: var(--urgent-red); }
        .bg-stable { background: var(--success-green); }

        /* --- Layout Grid --- */
        .profile-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .card h3 { margin-top: 0; font-size: 0.9rem; color: #888; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }

        /* --- Vitals Monitor Style --- */
        .vitals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; text-align: center; }
        .vital-box { padding: 15px; border-radius: 10px; background: #fcfcfc; border: 1px solid #f0f0f0; }
        .vital-box i { font-size: 1.2rem; margin-bottom: 10px; display: block; }
        .vital-box label { font-size: 0.6rem; font-weight: bold; color: #999; display: block; }
        .vital-box span { font-size: 1.4rem; font-weight: 800; color: var(--pgh-dark-green); }

        /* --- Clinical Tools --- */
        .tool-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tool-btn { flex: 1; padding: 8px; border: 1px solid #ddd; background: #f9f9f9; cursor: pointer; font-size: 0.7rem; font-weight: bold; border-radius: 5px; }
        .tool-btn.active { background: var(--pgh-emerald); color: white; border-color: var(--pgh-emerald); }
        .score-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 0.8rem; }
        .score-val { font-weight: bold; color: var(--pgh-emerald); }

        /* --- Status Control --- */
        .action-footer { display: flex; gap: 10px; margin-top: 10px; }
        .btn-status { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; }
        .btn-queue { background: #fff3e0; color: #ef6c00; }
        .btn-care { background: #e3f2fd; color: #1565c0; }
        .btn-discharge { background: var(--pgh-emerald); color: white; }

        /* --- Bed Overlay --- */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:25px; border-radius:15px; width:400px; text-align:center; }
        .bed-choice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .bed-opt { padding: 10px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .bed-opt:hover { background: var(--pgh-emerald); color: white; }
    </style>
</head>
<body>

<header>
    <img src="logo.png" class="hospital-logo" alt="Logo">
    <div class="brand-text">
        <h2>General Hospital</h2>
        <small>Clinical Profile View</small>
    </div>
</header>

<nav>
    <a href="admin_dashboard.html" class="back-btn"><i class="fas fa-chevron-left"></i> BACK TO DASHBOARD</a>
</nav>

<div class="container" id="profileContainer">
    </div>

<div id="bedModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-bed"></i> Assign ER Bed</h3>
        <p style="font-size:0.8rem; color:#888;">Select an available bed to start treatment</p>
        <div class="bed-choice-grid" id="bedOptions"></div>
        <button onclick="closeModal()" style="margin-top:20px; border:none; background:none; color:#888; cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const pIndex = params.get('id');
    
    function loadProfile() {
        const patients = JSON.parse(localStorage.getItem('patients')) || [];
        const p = patients[pIndex];

        if (!p) return;

        const container = document.getElementById('profileContainer');
        
        // Status Button Logic
        let statusButton = '';
        if (p.status === 'WAITING') {
            statusButton = `<button class="btn-status btn-queue" onclick="openBedModal()">SELECT BED (QUEUE)</button>`;
        } else if (p.status === 'READY') {
            statusButton = `<button class="btn-status btn-discharge" onclick="dischargePatient()">FINAL DISCHARGE</button>`;
        } else {
            statusButton = `<button class="btn-status btn-care" disabled>PATIENT IN CARE</button>`;
        }

        container.innerHTML = `
            <div class="patient-header">
                <div class="patient-identity">
                    <h1>${p.name} <span class="status-badge bg-crit">${p.level}</span></h1>
                    <small style="color:#888; font-weight:bold;">${p.age} Yrs • ${p.sex} • ARRIVED: ${p.arrived || '11:36 AM'}</small>
                </div>
                <div style="text-align:right">
                    <div style="font-size:0.6rem; color:#999; font-weight:bold;">ASSIGNED BED</div>
                    <div style="font-size:1.5rem; font-weight:900; color:var(--pgh-emerald);">${p.bed || 'NONE'}</div>
                </div>
            </div>

            <div class="profile-layout">
                <div>
                    <div class="card">
                        <h3><i class="fas fa-notes-medical"></i> Chief Complaint</h3>
                        <p style="font-size: 1.2rem; font-weight: 600; color: var(--pgh-dark-green); margin: 10px 0;">${p.complaint || 'No complaint noted'}</p>
                    </div>

                    <div class="card">
                        <h3><i class="fas fa-heartbeat"></i> Vital Signs</h3>
                        <div class="vitals-grid">
                            <div class="vital-box"><i class="fas fa-tint" style="color:#e74c3c"></i><label>BLOOD PRESSURE</label><span>${p.vitals?.bp || '160/95'}</span></div>
                            <div class="vital-box"><i class="fas fa-heart" style="color:#ff7675"></i><label>HEART RATE</label><span>${p.vitals?.hr || '110'}</span></div>
                            <div class="vital-box"><i class="fas fa-thermometer-half" style="color:#fab1a0"></i><label>TEMP</label><span>${p.vitals?.temp || '36.8'}°C</span></div>
                            <div class="vital-box"><i class="fas fa-wind" style="color:#81ecec"></i><label>RESP RATE</label><span>${p.vitals?.resp || '24'}</span></div>
                            <div class="vital-box"><i class="fas fa-wave-square" style="color:#55efc4"></i><label>SPO2</label><span>${p.vitals?.o2 || '92'}%</span></div>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="card">
                        <h3><i class="fas fa-toolbox"></i> Clinical Tools</h3>
                        <div class="tool-tabs">
                            <button class="tool-btn active">GCS</button>
                            <button class="tool-btn">PAIN SCALE</button>
                            <button class="tool-btn">ABCDE</button>
                        </div>
                        <div id="toolData">
                            <div class="score-row"><span>Eye Opening</span><span class="score-val">${p.gcs?.eye || '4'}</span></div>
                            <div class="score-row"><span>Verbal Response</span><span class="score-val">${p.gcs?.verbal || '5'}</span></div>
                            <div class="score-row"><span>Motor Response</span><span class="score-val">${p.gcs?.motor || '6'}</span></div>
                            <div style="text-align:center; padding-top:15px;">
                                <small style="display:block; color:#aaa;">TOTAL SCORE</small>
                                <strong style="font-size:1.5rem; color:var(--pgh-emerald)">15/15</strong>
                            </div>
                        </div>
                    </div>

                    <div class="card" style="border-top: 5px solid var(--pgh-emerald);">
                        <h3>Patient Management</h3>
                        <div class="action-footer">
                            ${statusButton}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // --- Interaction Logic ---
    function openBedModal() {
        const grid = document.getElementById('bedOptions');
        grid.innerHTML = '';
        ['A1','A2','A3','B1','B2','B3','C1','C2','C3'].forEach(b => {
            grid.innerHTML += `<div class="bed-opt" onclick="assignBed('${b}')">${b}</div>`;
        });
        document.getElementById('bedModal').style.display = 'flex';
    }

    function assignBed(bedNum) {
        let patients = JSON.parse(localStorage.getItem('patients'));
        patients[pIndex].bed = bedNum;
        patients[pIndex].status = 'IN CARE';
        localStorage.setItem('patients', JSON.stringify(patients));
        closeModal();
        loadProfile();
    }

    function dischargePatient() {
        let patients = JSON.parse(localStorage.getItem('patients'));
        patients[pIndex].status = 'DISCH'; // Moves to archived list
        localStorage.setItem('patients', JSON.stringify(patients));
        location.href = 'admin_dashboard.html';
    }

    function closeModal() { document.getElementById('bedModal').style.display = 'none'; }

    window.onload = loadProfile;
</script>

</body>
</html>
