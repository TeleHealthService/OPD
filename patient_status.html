<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile | General Hospital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
    --pgh-dark-green: #006400;  /* Changed from #0D2818 (Was very dark) */
    --pgh-emerald: #4CAF50;     /* Changed from #04471C (Was deep forest green) */
            --white: #ffffff;
            --light-gray: #f4f7f6;
            --urgent-red: #e74c3c;
            --info-blue: #3498db;
            --success-green: #27ae60;
        }

        * { box-sizing: border-box; transition: 0.3s ease; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light-gray); color: var(--pgh-black); overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }

        header { 
    /* Changed 0.85 opacity to 0.4 for a much lighter, clearer photo */
    background: linear-gradient(rgba(13, 40, 24, 0.4), rgba(13, 40, 24, 0.4)), url('bg1.png');
    background-size: cover; 
    background-position: center; 
    padding: 15px; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    gap: 12px; 
    border-bottom: 4px solid var(--pgh-emerald); 
}
        .header-left { display: flex; align-items: center; gap: 12px; }
        .hospital-logo { width: 40px; height: 40px; object-fit: contain; }
        .brand-text h2 { margin: 0; font-size: 1rem; color: var(--white); text-transform: uppercase; line-height: 1.1; }
        .brand-text small { color: rgba(255, 255, 255, 0.8); font-size: 0.65rem; display: block; }


        nav { background: var(--pgh-dark-green); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: white; text-decoration: none; font-size: 0.7rem; font-weight: bold; display: flex; align-items: center; gap: 5px; }

        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }

        .patient-header { background: white; border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .patient-identity h1 { margin: 0; font-size: 1.8rem; color: var(--pgh-dark-green); display: flex; align-items: center; gap: 10px; }
        
        .status-badge { padding: 5px 15px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: white; cursor: pointer; }
        .bg-CRITICAL { background: var(--urgent-red); }
        .bg-STABLE { background: var(--info-blue); }
        .bg-NORMAL { background: var(--success-green); }
        .bg-URGENT { background: #f39c12; }

        .profile-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .card h3 { margin-top: 0; font-size: 0.9rem; color: #888; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }

        .vitals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; text-align: center; margin-bottom: 15px; }
        .vital-box { padding: 15px; border-radius: 10px; background: #fcfcfc; border: 1px solid #f0f0f0; }
        .vital-box i { font-size: 1.2rem; margin-bottom: 10px; display: block; }
        .vital-box span { font-size: 1.4rem; font-weight: 800; color: var(--pgh-dark-green); }

        .doc-charge-area { border-top: 1px solid #eee; padding-top: 15px; display: flex; align-items: center; gap: 10px; }
        .doc-tag { font-size: 0.75rem; font-weight: bold; color: var(--pgh-emerald); cursor: pointer; background: #e8f5e9; padding: 4px 10px; border-radius: 4px; }

        .tool-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tool-btn { flex: 1; padding: 10px; border: 1px solid #ddd; background: #f9f9f9; cursor: pointer; font-size: 0.7rem; font-weight: bold; border-radius: 5px; }
        .tool-btn.active { background: var(--pgh-emerald); color: white; border-color: var(--pgh-emerald); }
        .tool-content { display: none; }
        .tool-content.active { display: block; }
        .score-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 0.8rem; }
        .score-val { font-weight: bold; color: var(--pgh-emerald); }

        .action-footer { display: flex; gap: 10px; margin-top: 10px; }
        .btn-status { flex: 1; padding: 18px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; }
        .btn-queue { background: #fff3e0; color: #ef6c00; }
        .btn-care { background: #e3f2fd; color: #1565c0; }
        .btn-ready { background: var(--pgh-emerald); color: white; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:25px; border-radius:15px; width:350px; text-align:center; }
        .choice-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .opt-btn { padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; text-align: left; display: flex; align-items: center; gap: 10px; }
        .opt-btn:hover { background: #f0f7f3; border-color: var(--pgh-emerald); }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png" class="hospital-logo" alt="Logo">
        <div class="brand-text">
            <h2>General Hospital</h2>
            <small>Clinical Profile View</small>
        </div>
    </div>
</header>

<nav>
    <a href="admin_dashboard.html" class="back-btn"><i class="fas fa-chevron-left"></i> BACK TO DASHBOARD</a>
</nav>

<div class="container" id="profileContainer"></div>

<div id="selectorModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Select Option</h3>
        <div class="choice-grid" id="modalOptions"></div>
        <button onclick="closeModal()" style="margin-top:20px; border:none; background:none; color:#888; cursor:pointer;">Cancel</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://general-hospital-74691-default-rtdb.firebaseio.com/",
        projectId: "general-hospital-74691"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const params = new URLSearchParams(window.location.search);
    const pId = params.get('id');
    let currentPath = 'patients'; 

    function loadProfile() {
        if (!pId) return;

        db.ref('patients/' + pId).on('value', (snapshot) => {
            let p = snapshot.val();
            if (!p) {
                db.ref('appointments/' + pId).once('value', (snap) => {
                    if (snap.val()) {
                        currentPath = 'appointments';
                        renderProfile(snap.val());
                    } else {
                        document.getElementById('profileContainer').innerHTML = "<h3>Patient Record Not Found</h3>";
                    }
                });
            } else {
                currentPath = 'patients';
                renderProfile(p);
            }
        });
    }

    function renderProfile(p) {
        const container = document.getElementById('profileContainer');
        let managementLabel = "Patient Management";
        let statusButton = '';

        if (!p.status || p.status === 'WAITING') {
            managementLabel = "Patient Management (QUEUE)";
            statusButton = `<button class="btn-status btn-queue" onclick="openModal('bed')">START TREATMENT</button>`;
        } else if (p.status === 'IN TREATMENT' || p.status === 'IN CARE') {
            managementLabel = "Patient Management (IN TREATMENT)";
            statusButton = `<button class="btn-status btn-care" onclick="handleDischargeCheck('${p.level || 'NORMAL'}')">PROCEED TO DISCHARGE</button>`;
        } else if (p.status === 'READY FOR DISCHARGE') {
            managementLabel = "Patient Management (FOR DISCHARGE)";
            statusButton = `<button class="btn-status btn-ready" onclick="finalizeDischarge()">CONFIRM FINAL DISCHARGE</button>`;
        }

        container.innerHTML = `
            <div class="patient-header">
                <div class="patient-identity">
                    <h1>${p.name || 'Unknown'} <span class="status-badge bg-${p.level || 'NORMAL'}" onclick="openModal('level')">${p.level || 'NORMAL'}</span></h1>
                    <small style="color:#888; font-weight:bold;">${p.age || '??'} Yrs • ${p.sex || p.gender || 'N/A'} • ARRIVED: ${p.arrived || p.timestamp || '---'}</small>
                </div>
                <div style="text-align:right; cursor:pointer;" onclick="openModal('bed')">
                    <div style="font-size:0.6rem; color:#999; font-weight:bold;">ASSIGNED BED</div>
                    <div style="font-size:1.5rem; font-weight:900; color:var(--pgh-emerald);">${p.bed || 'NONE'}</div>
                </div>
            </div>

            <div class="profile-layout">
                <div>
                    <div class="card">
                        <h3><i class="fas fa-notes-medical"></i> Chief Complaint</h3>
                        <p style="font-size: 1.2rem; font-weight: 600; color: var(--pgh-dark-green); margin: 10px 0;">${p.complaint || p.symptoms || 'No complaint noted'}</p>
                    </div>

                    <div class="card">
                        <h3><i class="fas fa-heartbeat"></i> Vital Signs (via Nurse)</h3>
                        <div class="vitals-grid">
                            <div class="vital-box"><i class="fas fa-tint" style="color:#e74c3c"></i><span>${p.vitals?.bp || '---'}</span><label>BP</label></div>
                            <div class="vital-box"><i class="fas fa-heart" style="color:#ff7675"></i><span>${p.vitals?.hr || '---'}</span><label>HR</label></div>
                            <div class="vital-box"><i class="fas fa-thermometer-half" style="color:#fab1a0"></i><span>${p.vitals?.temp || '---'}</span><label>TEMP</label></div>
                            <div class="vital-box"><i class="fas fa-wave-square" style="color:#55efc4"></i><span>${p.vitals?.o2 || '---'}</span><label>SPO2</label></div>
                        </div>
                        <div class="doc-charge-area">
                            <i class="fas fa-user-md" style="color:#888"></i>
                            <span style="font-size:0.7rem; color:#888; font-weight:bold;">MD IN CHARGE:</span>
                            <span class="doc-tag" onclick="openModal('doctor')">${p.doctorInCharge || 'ASSIGN DOCTOR +'}</span>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="card">
                        <h3><i class="fas fa-toolbox"></i> Clinical Tools</h3>
                        <div class="tool-tabs">
                            <button class="tool-btn active" onclick="switchTool(event, 'gcs')">GCS</button>
                            <button class="tool-btn" onclick="switchTool(event, 'pain')">PAIN SCALE</button>
                        </div>
                        <div id="gcs" class="tool-content active">
                            <div class="score-row"><span>Eye Opening</span><span class="score-val">${p.gcs?.eye || '0'}</span></div>
                            <div class="score-row"><span>Verbal</span><span class="score-val">${p.gcs?.verbal || '0'}</span></div>
                            <div class="score-row"><span>Motor</span><span class="score-val">${p.gcs?.motor || '0'}</span></div>
                        </div>
                        <div id="pain" class="tool-content">
                            <div style="text-align:center; padding: 20px 0;">
                                <label style="display:block; font-size:0.7rem; color:#888;">PAIN RATING</label>
                                <strong style="font-size:3rem; color:var(--urgent-red);">${p.painScale || '0'}/10</strong>
                            </div>
                        </div>
                    </div>

                    <div class="card" style="border-top: 5px solid var(--pgh-emerald);">
                        <h3>${managementLabel}</h3>
                        <div class="action-footer">
                            ${statusButton}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function openModal(type) {
        const title = document.getElementById('modalTitle');
        const options = document.getElementById('modalOptions');
        options.innerHTML = '';

        if (type === 'bed') {
            title.innerText = "Assign ER Bed";
            ['A1','A2','A3','B1','B2','B3','C1','C2','C3', 'D1','D2','D3'].forEach(b => {
                options.innerHTML += `<div class="opt-btn" onclick="updateField('bed', '${b}', true)"><i class="fas fa-bed"></i> Bed ${b}</div>`;
            });
        } else if (type === 'level') {
            title.innerText = "Set Triage Level";
            ['NORMAL', 'STABLE', 'URGENT'].forEach(l => {
                options.innerHTML += `<div class="opt-btn" onclick="updateField('level', '${l}')">${l}</div>`;
            });
        } else if (type === 'doctor') {
            title.innerText = "Assign Doctor in Charge";
            const doctors = JSON.parse(localStorage.getItem('hospitalDoctors')) || [];
            if (doctors.length === 0) {
                options.innerHTML = `<div style="padding:20px; color:#888; font-size:0.8rem;">No doctors found in local registry.</div>`;
            } else {
                doctors.forEach((doc) => {
                    options.innerHTML += `
                        <div class="opt-btn" onclick="updateField('doctorInCharge', '${doc.name}')">
                            <i class="fas fa-user-md"></i>
                            <div>
                                <div>${doc.name}</div>
                                <div style="font-size:0.65rem; color:#888;">${doc.spec || 'Staff'}</div>
                            </div>
                        </div>`;
                });
            }
        }
        document.getElementById('selectorModal').style.display = 'flex';
    }

    function updateField(field, value, isBed = false) {
        let updates = {};
        updates[field] = value;
        if (isBed) updates['status'] = 'IN TREATMENT';

        db.ref(currentPath + '/' + pId).update(updates).then(() => {
            closeModal();
        }).catch(err => alert("Cloud Sync Failed: " + err.message));
    }

    function handleDischargeCheck(level) {
        if (level === 'NORMAL') {
            window.location.href = `discharge.html?id=${pId}`;
        } else {
            alert("Clinical Warning: Patient level must be NORMAL before proceeding to discharge.");
        }
    }

    function finalizeDischarge() {
        db.ref(currentPath + '/' + pId).update({ 
            status: 'DISCHARGED', 
            isDischarged: true,
            bed: 'NONE' 
        }).then(() => {
            window.location.href = 'admin_dashboard.html';
        });
    }

    function switchTool(evt, toolId) {
        document.querySelectorAll('.tool-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(toolId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    function closeModal() { document.getElementById('selectorModal').style.display = 'none'; }
    window.onload = loadProfile;
</script>
</body>
</html>
